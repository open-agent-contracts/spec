# Source-currency watchlist for the Open Agent Contracts public
# reference portal.
#
# Maintainer-edited only in v0. The source-currency probe under
# maintainers/source-currency/ is read-only against this file; the probe
# never writes back. A maintainer updates the watchlist by hand: when a
# probe-emitted source-currency issue lands, the maintainer either
# updates verified_on (after pulling the source forward) or
# next_review_due (after deciding to defer review).
#
# Row schema:
#   id:                 stable slug used in issue titles and probe state
#   surface:            short human-readable name for the source surface
#   primary_urls:       ordered list of public URLs the probe should fetch
#   cadence_months:     review cadence in months (1, 3, or 6)
#   verified_on:        date the surface was last reviewed (YYYY-MM-DD)
#   next_review_due:    next-review date (verified_on + cadence_months)
#   version_signals:    optional list of regex-style version-string
#                       hints; on a hash change that also touches one of
#                       these signals the probe additionally emits the
#                       framework-version-bump label
#   mapping_status:     either "v0-mapping" (has a /mappings/* page) or
#                       "watchlist-only" (cited/deferred per CONCEPT-002
#                       plan section 5.3, no v0 /mappings/ page)
#   notes:              optional one-line note from the maintainer

